# Foundry config for the GRIFTERS contracts (site tooling ignores this).
# Setup once: `forge install foundry-rs/forge-std`
[profile.default]
src = "contracts"
out = "contracts/out"
libs = ["lib"]
script = "contracts/script"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
robinhood = "https://rpc.mainnet.chain.robinhood.com"
